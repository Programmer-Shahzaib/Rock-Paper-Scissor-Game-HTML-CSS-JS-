<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissor </title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div id="header">
        <h2>Rock Paper Scissor</h2>
      </div>
    </header>
    <main>
      <div id="container">
        <div id="game">
          <div id="rock">
            <i class="fa-solid fa-hand-fist"></i>
          </div>
          <div id="paper">
            <i class="fa-regular fa-hand"></i>
          </div>
          <div id="scissor">
            <i class="fa-regular fa-hand-scissors fa-rotate-90"></i>
          </div>
        </div>

        <div id="scores">
          <div id="you">
            <h3 id="y">0</h3>
            <h2>You</h2>
          </div>

          <div id="comp">
            <h3 id="c">0</h3>
            <h2>Comp</h2>
          </div>
        </div>

        <div id="winningText">
          <h2 id="winnerText">Pick Your Move</h2>
        </div>
        <div id="reset">
          <button id="restart">Restart</button>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
